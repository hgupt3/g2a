[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "grasp-to-act"
version = "0.3.0"
description = "Grasp to Act: task-oriented grasp optimization and residual reinforcement learning"
readme = "README.md"
license-files = ["THIRD_PARTY_NOTICES.md", "licenses/*.txt"]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<2", "scipy>=1.11,<2", "torch>=2.7", "gymnasium>=1.0,<2"]

[project.optional-dependencies]
visual = ["Pillow==11.3.0", "imageio-ffmpeg==0.6.0"]
rl = [
    "rl-games @ git+https://github.com/isaac-sim/rl_games.git@6b3534f29568158e9e29ec8bf83cc88fce5f0cae",
    "tensorboard>=2.16,<3",
    "PyYAML>=6",
]
dev = ["ruff==0.17.0", "build>=1.2,<1.4"]

[project.scripts]
g2a = "g2a.cli:main"

[tool.setuptools.packages.find]
include = ["g2a*"]
namespaces = true

[tool.setuptools.package-data]
g2a = ["ppo.yaml", "resources/**/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
